name: Update EPG

on:
  # Manuelles Starten weiterhin möglich
  workflow_dispatch:

  # Zweimal täglich:
  #
  # 03:00 UTC
  # 15:00 UTC
  #
  # 03:00 UTC:
  # 00:00 -> 00:00 nächster Tag
  #
  # 15:00 UTC:
  # 12:00 -> 12:00 nächster Tag
  schedule:
    - cron: "0 3,15 * * *"


# ============================================================
# VERHINDERT MEHRERE GLEICHZEITIGE DEPLOYMENTS
# ============================================================

concurrency:
  group: "pages"
  cancel-in-progress: true


# ============================================================
# BUILD
# ============================================================

jobs:

  build:
    runs-on: ubuntu-latest

    # BERECHTIGUNGEN BUILD:
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:

      # ------------------------------------------------------
      # Repository auschecken
      # ------------------------------------------------------

      - name: Repository auschecken
        uses: actions/checkout@v6


      # ------------------------------------------------------
      # Python einrichten
      # ------------------------------------------------------

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"


      # ------------------------------------------------------
      # EPG herunterladen und filtern
      #
      # Sicherheits-Timeout:
      # Nach 15 Minuten wird dieser Step beendet.
      # Dadurch kann ein hängender Download oder Prozess
      # den Workflow nicht unbegrenzt laufen lassen.
      # ------------------------------------------------------

      - name: EPG filtern
        timeout-minutes: 15
        run: python epg_filter.py

      - name: Prüfen ob XML erstellt wurde
        run: |
          echo "================================"
          echo "EPG DATEI KONTROLLE"
          echo "================================"

          pwd

          echo ""
          echo "public Verzeichnis:"
          ls -lah public || true

          echo ""
          echo "EPG-Datei prüfen:"

          if [ -f "public/epg_ssiptv.xml" ]; then
            echo "OK: epg_ssiptv.xml wurde erstellt."
            ls -lh public/epg_ssiptv.xml
            echo ""
            echo "Bytes:"
            wc -c public/epg_ssiptv.xml
          else
            echo "FEHLER: epg_ssiptv.xml wurde NICHT erstellt!"
            exit 1
          fi


      # ------------------------------------------------------
      # GitHub Pages vorbereiten
      # ------------------------------------------------------

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v6


      # ------------------------------------------------------
      # EPG für GitHub Pages bereitstellen
      # ------------------------------------------------------

      - name: EPG für Pages vorbereiten
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public


      # ------------------------------------------------------
      # EPG in das Cloudflare-Verzeichnis verschieben
      # ------------------------------------------------------

      - name: EPG für Cloudflare bereitstellen
        run: |
          mkdir -p ssiptv-greek-epg/public
          cp public/epg_ssiptv.xml ssiptv-greek-epg/public/epg_ssiptv.xml


      # ------------------------------------------------------
      # Prüfen, ob die Cloudflare-XML-Datei wirklich vorhanden ist
      # ------------------------------------------------------

      - name: EPG-Datei kontrollieren
        run: |
          echo "Cloudflare EPG:"
          ls -lh ssiptv-greek-epg/public/epg_ssiptv.xml

          echo ""
          echo "Dateigröße:"
          wc -c ssiptv-greek-epg/public/epg_ssiptv.xml


      # ------------------------------------------------------
      # EPG ins Repository committen
      # ------------------------------------------------------

      - name: EPG committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ssiptv-greek-epg/public/epg_ssiptv.xml

          git diff --cached --quiet || git commit -m "Test: Update Cloudflare EPG"

          git push

          
# ============================================================
# DEPLOY
# ============================================================

  deploy:
    needs: build

    runs-on: ubuntu-latest
    
    # BERECHTIGUNGEN DEPLOY:
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ------------------------------------------------------
      # EPG veröffentlichen
      # ------------------------------------------------------

      - name: EPG veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
