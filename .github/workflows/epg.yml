name: Update EPG

on:
  workflow_dispatch:

  schedule:
    - cron: "0 4,16 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: EPG filtern
        run: python epg_filter.py

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: EPG für Pages vorbereiten
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: EPG veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
