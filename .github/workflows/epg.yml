name: Update EPG

on:

  # ----------------------------------------------------------
  # Manuelles Starten weiterhin möglich
  # ----------------------------------------------------------

  workflow_dispatch:


  # ----------------------------------------------------------
  # Zweimal täglich
  #
  # 03:00 UTC => 00:00 bis 00:00 nächster Tag
  # 15:00 UTC => 12:00 bis 12:00 nächster Tag
  # ----------------------------------------------------------

  schedule:
    - cron: "0 3,15 * * *"


# ============================================================
# VERHINDERT MEHRERE GLEICHZEITIGE AUSFÜHRUNGEN
# ============================================================

concurrency:
  group: "epg-update"
  cancel-in-progress: true


# ============================================================
# BUILD
# ============================================================

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write


    steps:

      # ------------------------------------------------------
      # Repository auschecken
      # ------------------------------------------------------

      - name: Repository auschecken
        uses: actions/checkout@v6


      # ------------------------------------------------------
      # Python einrichten
      # ------------------------------------------------------

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"


      # ------------------------------------------------------
      # EPG herunterladen und filtern
      #
      # Ausgabe:
      # ./public/epg_ssiptv.xml
      # ------------------------------------------------------

      - name: EPG filtern
        timeout-minutes: 15
        run: python epg_filter.py


      # ======================================================
      # ERZEUGTE EPG-DATEI KONTROLLIEREN
      # ======================================================

      - name: Erzeugte EPG-Datei kontrollieren
        run: |

          echo "========================================"
          echo "EPG DATEI KONTROLLE"
          echo "========================================"

          pwd

          echo ""
          echo "Public-Verzeichnis:"
          ls -lah public || true

          echo ""
          echo "EPG-Datei:"

          if [ -f "public/epg_ssiptv.xml" ]; then

            echo "OK: public/epg_ssiptv.xml vorhanden."

            ls -lh public/epg_ssiptv.xml

            echo ""
            echo "Dateigröße:"
            wc -c public/epg_ssiptv.xml

          else

            echo "FEHLER:"
            echo "public/epg_ssiptv.xml wurde nicht erstellt!"

            exit 1

          fi


      # ======================================================
      # GITHUB PAGES VORBEREITEN
      # ======================================================

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v6


      # ======================================================
      # GITHUB PAGES DATEI ERSTELLEN
      #
      # Die Python-Ausgabe heißt:
      #
      # public/epg_ssiptv.xml
      #
      # Auf GitHub Pages soll sie aber heißen:
      #
      # small-epg.xml
      # ======================================================

      - name: GitHub Pages EPG vorbereiten
        run: |

          rm -rf pages-public

          mkdir -p pages-public

          cp \
            public/epg_ssiptv.xml \
            pages-public/small-epg.xml

          echo "========================================"
          echo "GITHUB PAGES DATEI"
          echo "========================================"

          ls -lh pages-public/small-epg.xml

          echo ""
          echo "Dateigröße:"
          wc -c pages-public/small-epg.xml


      # ======================================================
      # GITHUB PAGES ARTIFACT HOCHLADEN
      # ======================================================

      - name: EPG für GitHub Pages bereitstellen
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./pages-public


      # ======================================================
      # CLOUDFLARE VERZEICHNIS VORBEREITEN
      #
      # Ziel:
      #
      # ssiptv-greek-epg/public/ssiptv-epg.xml
      #
      # ======================================================

      - name: EPG für Cloudflare vorbereiten
        run: |

          mkdir -p ssiptv-greek-epg/public

          cp \
            public/epg_ssiptv.xml \
            ssiptv-greek-epg/public/ssiptv-epg.xml

          echo "========================================"
          echo "CLOUDFLARE EPG"
          echo "========================================"

          ls -lh \
            ssiptv-greek-epg/public/ssiptv-epg.xml

          echo ""
          echo "Dateigröße:"
          wc -c \
            ssiptv-greek-epg/public/ssiptv-epg.xml


      # ======================================================
      # CLOUDFLARE DATEI KONTROLLIEREN
      # ======================================================

      - name: Cloudflare EPG kontrollieren
        run: |

          echo "========================================"
          echo "CLOUDFLARE DATEI KONTROLLE"
          echo "========================================"

          if [ \
            -f "ssiptv-greek-epg/public/ssiptv-epg.xml" \
          ]; then

            echo "OK: ssiptv-epg.xml vorhanden."

            ls -lh \
              ssiptv-greek-epg/public/ssiptv-epg.xml

            echo ""
            echo "Bytes:"

            wc -c \
              ssiptv-greek-epg/public/ssiptv-epg.xml

          else

            echo "FEHLER:"
            echo \
              "ssiptv-greek-epg/public/ssiptv-epg.xml fehlt!"

            exit 1

          fi


      # ======================================================
      # CLOUDFLARE EPG INS REPOSITORY COMMITTEN
      #
      # Cloudflare ist mit dem Repository verbunden.
      #
      # Der Push löst anschließend automatisch den
      # Cloudflare Build aus.
      # ======================================================

      - name: Cloudflare EPG committen
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            ssiptv-greek-epg/public/ssiptv-epg.xml


          if git diff --cached --quiet; then

            echo "Keine Änderung an der Cloudflare EPG."

          else

            git commit \
              -m "Update Cloudflare EPG"

            git push

          fi


# ============================================================
# DEPLOY GITHUB PAGES
# ============================================================

  deploy:

    needs: build

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write


    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}


    steps:

      # ------------------------------------------------------
      # GitHub Pages veröffentlichen
      # ------------------------------------------------------

      - name: EPG veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
        
