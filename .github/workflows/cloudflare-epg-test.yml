name: Test Cloudflare EPG

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  test-cloudflare-epg:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Repository auschecken
      # ------------------------------------------------------

      - name: Repository auschecken
        uses: actions/checkout@v6


      # ------------------------------------------------------
      # Python einrichten
      # ------------------------------------------------------

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"


      # ------------------------------------------------------
      # EPG erzeugen
      # ------------------------------------------------------

      - name: EPG erzeugen
        timeout-minutes: 15
        run: |
          python epg_filter.py


      # ------------------------------------------------------
      # EPG in das Cloudflare-Verzeichnis verschieben
      # ------------------------------------------------------

      - name: EPG für Cloudflare bereitstellen
        run: |
          mkdir -p ssiptv-greek-epg/public
          cp public/epg_ssiptv.xml ssiptv-greek-epg/public/epg_ssiptv.xml


      # ------------------------------------------------------
      # Prüfen, ob die Datei wirklich vorhanden ist
      # ------------------------------------------------------

      - name: EPG-Datei kontrollieren
        run: |
          echo "Cloudflare EPG:"
          ls -lh ssiptv-greek-epg/public/epg_ssiptv.xml

          echo ""
          echo "Dateigröße:"
          wc -c ssiptv-greek-epg/public/epg_ssiptv.xml


      # ------------------------------------------------------
      # EPG ins Repository committen
      # ------------------------------------------------------

      - name: EPG committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ssiptv-greek-epg/public/epg_ssiptv.xml

          git diff --cached --quiet || git commit -m "Test: Update Cloudflare EPG"

          git push
